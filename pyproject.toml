[project]
name = "agentic-ai-security"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Core ML dependencies
    "numpy==1.26.3",
    "torch",
    "torchvision",
    "torchaudio",
    # vLLM and model dependencies
    "transformers[torch]==4.57.3",
    "vllm==0.6.3",
    "lm-format-enforcer",
    "xformers==0.0.27.post2",
    # Database and server
    "psycopg2-binary==2.9.11",
    "gpustat==1.1.1",
    "mcp",
    "starlette",
    "uvicorn",
    "asyncpg",
    "pyairports",
    "requests",
    # MARFT dependencies
    "absl-py",
    "cloudpickle",
    "fairscale",
    "json-repair",
    "peft",
    "pydantic",
    "sentence-transformers",
    "sentencepiece",
    "setproctitle",
    "tensorboard",
    "tensorboardX",
    "latex2sympy2",
    "word2number",
    "bert-score",
    "matplotlib",
    "scipy",
    "seaborn",
    "scikit-learn>=1.7.2",
    "sqlglot>=30.9.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]
# The PyPI name "pyairports" now resolves only to a placeholder release (0.0.1,
# author "John Doe") that ships a "sample"/"tests" skeleton instead of the
# pyairports module. That breaks `import outlines` — a transitive vLLM
# guided-decoding dependency — making every vLLM chat completion return HTTP
# 500. Pin to the genuine package vendored under vendor/pyairports/.
pyairports = [{ path = "vendor/pyairports", editable = false }]
